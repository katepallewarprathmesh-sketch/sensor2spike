name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Core + every extra that is installable on a stock runner.
          # `torch` is deliberately excluded: the reference backend needs no
          # deep-learning framework and downloading it on each matrix leg would
          # dwarf the test time.
          pip install -e ".[dev,bayes,viz]"

      - name: Lint
        run: ruff check src tests examples

      - name: Test
        run: pytest --cov=sensor2spike --cov-report=term-missing

      - name: Smoke-test the CLI
        run: |
          sensor2spike --version
          sensor2spike encoders
          sensor2spike demo --out /tmp/demo.npz --trials 12
          sensor2spike optimize /tmp/demo.npz \
            --encoder rate --trials 3 --window 0.25 \
            --registry /tmp/ci.db --out /tmp/results --no-plots
          sensor2spike list --registry /tmp/ci.db
